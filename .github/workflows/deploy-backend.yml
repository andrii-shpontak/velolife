name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: |
          cd apps/backend
          pnpm install --frozen-lockfile

      - name: Build backend
        run: |
          cd apps/backend
          npx nest build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Prepare deployment package
        run: |
          cd apps/backend
          zip -r backend.zip dist package.json package-lock.json node_modules

      - name: Deploy to Elastic Beanstalk
        run: |
          cd apps/backend
          aws s3 cp backend.zip s3://elasticbeanstalk-eu-north-1-274979550084/backend/github-${{ github.sha }}.zip
          aws elasticbeanstalk create-application-version \
            --application-name velo-life-backend \
            --version-label github-${{ github.sha }} \
            --source-bundle S3Bucket="elasticbeanstalk-eu-north-1-274979550084",S3Key="backend/github-${{ github.sha }}.zip"
          aws elasticbeanstalk update-environment \
            --environment-name velo-life-backend-env \
            --version-label github-${{ github.sha }}
